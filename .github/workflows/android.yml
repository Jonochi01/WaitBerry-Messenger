name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      # The repo's build.gradle.kts points the debug signing config at
      # ./debug.keystore, but that file is gitignored, so it must be
      # (re)created on every run or the build fails with "keystore not found".
      - name: Generate debug keystore
        run: |
          keytool -genkeypair -v \
            -keystore debug.keystore \
            -storepass android -keypass android \
            -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      # gradlew isn't committed to this repo, so instead of "./gradlew build"
      # we let setup-gradle provision the exact Gradle version from
      # gradle/wrapper/gradle-wrapper.properties and invoke gradle directly.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.3.1

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: waitberry-messenger-debug-apk
          path: app/build/outputs/apk/debug/*.apk
